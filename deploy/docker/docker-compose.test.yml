# docker-compose.test.yml — Integration tests with real PostgreSQL
# Usage: docker compose -f deploy/docker/docker-compose.test.yml run --rm integration-tests
#
# Or simply: make test-integration

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoicegen_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 2s
      timeout: 3s
      retries: 10

  migrate-test:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    environment:
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: invoicegen_test
      DB_USER: testuser
      DB_PASSWORD: testpass
    depends_on:
      postgres-test:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/migrate.sh"]
    restart: "no"

  integration-tests:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.test
    environment:
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: invoicegen_test
      DB_USER: testuser
      DB_PASSWORD: testpass
      DOCKER_HOST: ""
      TESTCONTAINERS_RYUK_DISABLED: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    command: ["go", "test", "-tags=integration", "-v", "-count=1", "-timeout=300s", "./internal/infrastructure/repository/integration/..."]
    restart: "no"