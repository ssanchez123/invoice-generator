services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoicegen
      POSTGRES_USER: invoicegen
      POSTGRES_PASSWORD: invoicegen_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicegen"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: invoicegen
      DB_USER: invoicegen
      DB_PASSWORD: invoicegen_dev
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/migrate.sh"]
    restart: "no"

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: invoicegen
      DB_USER: invoicegen_app
      DB_PASSWORD: invoicegen_dev
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRY: 24h
      PORT: 8080
      ENVIRONMENT: development
      PDF_STORAGE_BACKEND: local
      PDF_STORAGE_PATH: /var/pdfs
    ports:
      - "8080:8080"
    volumes:
      - pdfdata:/var/pdfs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["api"]

  relay-worker:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: invoicegen
      DB_USER: invoicegen_app
      DB_PASSWORD: invoicegen_dev
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["relay-worker"]

  pdf-service:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: invoicegen
      DB_USER: invoicegen_app
      DB_PASSWORD: invoicegen_dev
      ENVIRONMENT: development
      PDF_STORAGE_BACKEND: local
      PDF_STORAGE_PATH: /var/pdfs
    volumes:
      - pdfdata:/var/pdfs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["pdf-service"]

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  pdfdata: